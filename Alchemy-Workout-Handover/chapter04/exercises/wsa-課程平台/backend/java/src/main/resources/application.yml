spring:
  application:
    name: wsa-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/chapter04_dev
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

# JWT Configuration
jwt:
  secret-key: chapter04-test-secret-key-do-not-use-in-production
  algorithm: HS256
  expire-hours: 1

# API Configuration
api:
  v1:
    prefix: /api/v1
