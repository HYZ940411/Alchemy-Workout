spring:
  datasource:
    # Will be overridden by Testcontainers
    url: jdbc:tc:postgresql:15:///chapter04_test
    username: postgres
    password: postgres
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false

# JWT Configuration (same as dev for testing)
jwt:
  secret-key: chapter04-test-secret-key-do-not-use-in-production
  algorithm: HS256
  expire-hours: 1
